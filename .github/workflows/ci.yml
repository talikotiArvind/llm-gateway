name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in step with the uv image tag in Dockerfile (uv.lock revision 3 needs uv 0.12.x).
  UV_VERSION: "0.12.21"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src tests fake_provider

      - name: Import contracts
        run: uv run lint-imports

      - name: Unit and contract tests
        run: >-
          uv run pytest -m "unit or contract"
          --cov --cov-branch --cov-report=term --cov-report=xml

      - name: Branch coverage >= 75%
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET  # noqa: S405 - parses our own coverage.xml

          root = ET.parse("coverage.xml").getroot()  # noqa: S314
          branches_valid = int(root.get("branches-valid", "0"))
          rate = float(root.get("branch-rate", "1")) if branches_valid else 1.0
          print(f"branch coverage: {rate:.2%} ({branches_valid} branches)")
          sys.exit(0 if rate >= 0.75 else 1)
          PY

      - name: Bandit
        run: uv run bandit -q -r src fake_provider

      - name: Pip audit
        run: uv run pip-audit

  integration:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: switchyard
          POSTGRES_PASSWORD: switchyard
          POSTGRES_DB: switchyard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U switchyard"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Single Alembic head
        if: hashFiles('alembic.ini') != ''
        run: test "$(uv run alembic heads | grep -c '(head)')" -eq 1

      - name: Integration and security tests
        # Exit code 5 = no tests collected yet; treat as success until suites land.
        # TODO(2026-11-05): drop `|| [ $? -eq 5 ]` once T14 lands integration tests, so a marker
        # typo that deselects every test cannot pass silently.
        run: uv run pytest -m "integration or security" || [ $? -eq 5 ]

  compose-smoke:
    # M0 exit gate: both images build and the stack comes up healthy (/healthz, fake /v1/models).
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: >-
          docker compose up -d --wait --wait-timeout 180
          gateway postgres redis otel-collector fake-provider

      - name: Gateway /healthz
        run: curl -fsS --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8080/healthz

      - name: Fake provider /v1/models
        run: curl -fsS --retry 5 --retry-connrefused --retry-delay 2 http://localhost:9000/v1/models

      - name: Dump logs
        if: always()
        run: docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose down -v
