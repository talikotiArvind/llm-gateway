name: Update Repo Knowledge Base

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  update-kb:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit vault/kb/ back to main

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2        # need HEAD and HEAD~1 for diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run KB updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python -m pipeline.second_brain.kb_runner \
            --vault ./vault \
            --pr-number "$PR_NUMBER" \
            --pr-title "$PR_TITLE" \
            --base HEAD~1 \
            --head HEAD

      - name: Commit KB updates
        run: |
          git config user.name  "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git add vault/kb/
          if git diff --cached --quiet; then
            echo "No KB changes to commit."
          else
            git commit -m "kb: update knowledge base after PR #${{ github.event.pull_request.number }}"
            git push origin main
          fi
