repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Runs mypy from the project venv so plugins and stubs match pyproject.toml.
      - id: mypy
        name: mypy
        entry: uv run mypy src tests fake_provider
        language: system
        types: [python]
        pass_filenames: false
